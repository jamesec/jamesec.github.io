<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#12141a" />
        <title>cmd/ctrl + e to export — tiny editor</title>
        <link
            rel="icon"
            href="data:image/svg+xml, <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='90' font-size='90'>😄</text></svg>"
        />
        <style>
            :root {
                --background-primary: #12141a;
                --editor-text-color: #e4e4e7;
                --caret-color: #7ac7fb;
                --export-bg-color: #1a2a3a; /* Used for successful export flash */
                --error-bg-color: #5a2a2a; /* Used for error flash */
            }
            html,
            body {
                margin: 0;
                background: var(--background-primary);
            }
            #editor {
                min-height: 100vh;
                box-sizing: border-box;
                color: var(--editor-text-color);
                -webkit-text-fill-color: var(--editor-text-color);
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                font-size: clamp(16px, 2.5vw, 22px);
                line-height: 1.45;
                padding: clamp(16px, 4vw, 48px);
                max-width: 72ch;
                margin: 0 auto;
                overflow-x: hidden;
                outline: none;
                caret-color: var(--caret-color);
                transition: background-color 0.3s ease;
                white-space: pre-wrap;
                word-break: break-word;
                user-select: text;
                -webkit-user-select: text;
                -webkit-text-size-adjust: 100%;
            }
        </style>
    </head>
    <body>
        <div
            id="editor"
            contenteditable
            autofocus
            spellcheck="false"
            role="textbox"
            tabindex="0"
            aria-multiline="true"
            aria-label="tiny editor"
        ></div>
        <script>
            const editor = document.getElementById("editor");
            function flashBackground(variableName) {
                const computedStyle = getComputedStyle(document.body);
                const color = computedStyle
                    .getPropertyValue(variableName)
                    .trim();
                if (color) {
                    document.body.style.backgroundColor = color;
                    setTimeout(() => {
                        document.body.style.backgroundColor = "";
                    }, 300);
                }
            }
            function exportNotes() {
                const text = editor.innerText.trimEnd();
                if (!text.trim()) return;
                try {
                    const blob = new Blob([text], {
                        type: "text/plain;charset=utf-8",
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    const d = new Date();
                    const date =
                        `${d.getFullYear()}-` +
                        `${String(d.getMonth() + 1).padStart(2, "0")}-` +
                        `${String(d.getDate()).padStart(2, "0")}`;
                    a.href = url;
                    a.download = `notes-${date}.txt`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                    flashBackground("--export-bg-color");
                } catch {
                    flashBackground("--error-bg-color");
                }
            }
            document.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "e") {
                    e.preventDefault();
                    exportNotes();
                }
            });
        </script>
    </body>
</html>
